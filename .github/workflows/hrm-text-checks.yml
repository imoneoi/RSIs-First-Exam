name: HRM-Text source and CPU checks

on:
  pull_request:
    paths:
      - "rsi-tasks/signature-tasks/hrm_text_pretraining/**"
      - "checks/check*.sh"
      - "checks/check_hrm_text.py"
      - "checks/test_task_timeout.py"
      - ".github/workflows/static-checks.yml"
      - ".github/workflows/hrm-text-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hrm-text-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/checkout@v4
        with:
          repository: sapientinc/HRM-Text
          ref: c2865cf8df3caf53b6ec44a223fdccc4d276a20e
          path: .ci/hrm-text
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: sapientinc/data_io
          ref: 3728ebea6b6a7ff554af4e51350e6fd9e4b83fa6
          path: .ci/data-io
          persist-credentials: false
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r rsi-tasks/signature-tasks/hrm_text_pretraining/environment/setup/requirements-data.txt safetensors==0.7.0
          python -m pip install --no-deps evalplus==0.3.1
      - name: Run all static checks and CPU regressions
        # Linux root is required for real chroot/seccomp tests; skipped tests fail.
        # No data or weights are downloaded, and no GPU training is launched.
        run: |
          sudo "$(command -v python)" checks/check_hrm_text.py \
            --hrm-source .ci/hrm-text --data-io-source .ci/data-io \
            --report /tmp/hrm-text-checks.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hrm-text-checks
          path: /tmp/hrm-text-checks.json
          if-no-files-found: ignore
